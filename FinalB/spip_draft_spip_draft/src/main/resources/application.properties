spring.application.name=spip_draft
server.port=9090

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/spip_db
spring.datasource.username=root
spring.datasource.password=raju

# JPA (FIXED)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwtSecret=spipSecretKeyForJwtGenerationMustBeLongEnough123456789
app.jwtExpirationInMs=86400000


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

layout.opencv.upload-dir=uploads/layouts
layout.opencv.debug-dir=uploads/layouts/debug
layout.opencv.adaptive-radius=40
layout.opencv.canny-threshold1=10.0
layout.opencv.canny-threshold2=150.0
layout.opencv.gaussian-kernel=5
layout.opencv.blueprint-dark-thresh=140
layout.opencv.min-plot-area-px=300.0
layout.opencv.max-plot-area-ratio=0.04
layout.opencv.min-rectangularity=0.45
layout.opencv.max-aspect-ratio=6.0
layout.opencv.contour-approx-epsilon-ratio=0.02
layout.opencv.default-scale-factor-px-per-sqft=100.0
layout.opencv.pdf-render-dpi=150